services:
  - type: web
    name: momaidham-automation
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /ping
    envVars:
      - key: TARGET_WHATSAPP_GROUP_JID
        sync: false
      - key: INSTAGRAM_USERNAME
        sync: false
      - key: INSTAGRAM_PASSWORD
        sync: false
      - key: ENABLE_AUTO_UPLOAD
        value: "true"
      - key: DARSHAN_START_HOUR
        value: "5"
      - key: DARSHAN_END_HOUR
        value: "13"
      - key: REEL_DURATION
        value: "15"
      - key: DELETE_TEMP_AFTER_UPLOAD
        value: "true"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256 --expose-gc"
